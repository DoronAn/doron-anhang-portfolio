<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="system-ui,-apple-system,sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<text x="480" y="22" text-anchor="middle" font-size="11" fill="#999" font-weight="500" letter-spacing="0.5">PRIVACY-BY-DESIGN — ANONYMISATION ARCHITECTURE</text><defs>
  <marker id="arr"     viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#555555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arr-msg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arr-lt"  viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#aaa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs><text x="220" y="46" text-anchor="middle" font-size="11" font-weight="600" fill="#9a7a4a" letter-spacing="0.3">ANDROID DEVICE</text>
<text x="720" y="46" text-anchor="middle" font-size="11" font-weight="600" fill="#4a6a9a" letter-spacing="0.3">AWS RDS (MySQL)</text>
<line x1="470" y1="36" x2="470" y2="490" stroke="#e8e8e2" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="60" y="60" width="150" height="52" rx="6" fill="#fdf8f0" stroke="#c8a96e" stroke-width="1.5"/>
<text x="135" y="80.0" text-anchor="middle" font-size="12" font-weight="600" fill="#3a2a0a">Device ID</text>
<text x="135" y="96.0" text-anchor="middle" font-size="10" font-weight="400" fill="#9a7a4a">hardware serial</text>
<rect x="230" y="60" width="150" height="52" rx="6" fill="#fdf8f0" stroke="#c8a96e" stroke-width="1.5"/>
<text x="305" y="80.0" text-anchor="middle" font-size="12" font-weight="600" fill="#3a2a0a">Reg time</text>
<text x="305" y="96.0" text-anchor="middle" font-size="10" font-weight="400" fill="#9a7a4a">timestamp</text>
<line x1="135" y1="112" x2="165" y2="152" stroke="#c8a96e" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="305" y1="112" x2="225" y2="152" stroke="#c8a96e" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="80" y="152" width="280" height="52" rx="6" fill="#e8f7f2" stroke="#c8a96e" stroke-width="1.5"/>
<text x="220" y="172.0" text-anchor="middle" font-size="12" font-weight="600" fill="#3a2a0a">Hash.kt</text>
<text x="220" y="188.0" text-anchor="middle" font-size="10" font-weight="400" fill="#9a7a4a">SHA on-device — never sent raw</text>
<line x1="360" y1="178" x2="484" y2="178" stroke="#c8a96e" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="422" y="170" text-anchor="middle" font-size="9" fill="#9a7a4a">hash(id × ts)</text>
<rect x="486" y="152" width="160" height="52" rx="6" fill="#e8f7f2" stroke="#c8a96e" stroke-width="1.5"/>
<text x="566" y="172.0" text-anchor="middle" font-size="12" font-weight="600" fill="#3a2a0a">Anon token</text>
<text x="566" y="188.0" text-anchor="middle" font-size="10" font-weight="400" fill="#9a7a4a">only ID transmitted</text>
<rect x="60" y="244" width="280" height="52" rx="6" fill="#faece7" stroke="#f0997b" stroke-width="1.5"/>
<text x="200" y="264.0" text-anchor="middle" font-size="12" font-weight="600" fill="#4a1b0c">Email (raffle only)</text>
<text x="200" y="280.0" text-anchor="middle" font-size="10" font-weight="400" fill="#993c1d">Server-hashed · never linked to token</text>
<text x="200" y="316" text-anchor="middle" font-size="9" fill="#bbb">isolated — not transmitted to main DB</text>
<path d="M646 178 L660 118" fill="none" stroke="#7a9ec8" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M646 178 L660 248" fill="none" stroke="#7a9ec8" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M646 178 L660 378" fill="none" stroke="#7a9ec8" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="660" y="84" width="260" height="68" rx="6" fill="#f0f4fa" stroke="#7a9ec8" stroke-width="1.5"/>
<text x="790" y="104.0" text-anchor="middle" font-size="12" font-weight="600" fill="#0a1e3a">Users table</text>
<text x="790" y="120.0" text-anchor="middle" font-size="10" font-weight="400" fill="#4a6a9a">token · age · major · area_id</text>
<text x="790" y="136.0" text-anchor="middle" font-size="10" font-weight="400" fill="#4a6a9a">Joined via anon token only</text>
<rect x="660" y="214" width="260" height="68" rx="6" fill="#f0f4fa" stroke="#7a9ec8" stroke-width="1.5"/>
<text x="790" y="234.0" text-anchor="middle" font-size="12" font-weight="600" fill="#0a1e3a">Location table</text>
<text x="790" y="250.0" text-anchor="middle" font-size="10" font-weight="400" fill="#4a6a9a">token · lat · lng · accuracy · ts</text>
<text x="790" y="266.0" text-anchor="middle" font-size="10" font-weight="400" fill="#4a6a9a">No identity data</text>
<rect x="660" y="344" width="260" height="68" rx="6" fill="#f0f4fa" stroke="#7a9ec8" stroke-width="1.5"/>
<text x="790" y="364.0" text-anchor="middle" font-size="12" font-weight="600" fill="#0a1e3a">Survey table</text>
<text x="790" y="380.0" text-anchor="middle" font-size="10" font-weight="400" fill="#4a6a9a">token · SCI-2 · URES answers</text>
<text x="790" y="396.0" text-anchor="middle" font-size="10" font-weight="400" fill="#4a6a9a">Separate from location table</text>
<rect x="60" y="438" width="840" height="30" rx="4" fill="#e8eef8" stroke="#c0d0e8" stroke-width="1"/>
<text x="480" y="457" text-anchor="middle" font-size="10" fill="#4a6a9a">No personal identifiers stored · Tables joined only via anon token · Email hashed separately, never linked to GPS or survey data</text>
<rect x="60" y="494" width="12" height="12" rx="2" fill="#fdf8f0" stroke="#c8a96e" stroke-width="1.5"/>
<text x="78" y="503" font-size="10" fill="#555">Device-side processing</text>
<rect x="250" y="494" width="12" height="12" rx="2" fill="#e8f7f2" stroke="#c8a96e" stroke-width="1.5"/>
<text x="268" y="503" font-size="10" fill="#555">Hashing / anonymisation</text>
<rect x="447" y="494" width="12" height="12" rx="2" fill="#f0f4fa" stroke="#7a9ec8" stroke-width="1.5"/>
<text x="465" y="503" font-size="10" fill="#555">Server storage</text>
<rect x="581" y="494" width="12" height="12" rx="2" fill="#faece7" stroke="#f0997b" stroke-width="1.5"/>
<text x="599" y="503" font-size="10" fill="#555">Isolated (email only)</text>
</svg>