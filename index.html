<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doron Anhang – Architectural R&D</title>
<meta name="description" content="Doron Anhang – architect-researcher. Evidence-based architecture, spatial research, and handcrafted design.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,300;0,400;0,500;0,600;0,800;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════ TOKENS ═══════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* NKDT logo palette, matured */
  --ivory:#F6F1E7; --ivory2:#EFE8D9; --ink:#211E19; --warm-gray:#6E675B;
  --bronze:#A8814C; --sage:#65805F; --slate:#33526B; --clay:#9E4B3C;
  --hair:#DCD3C2;
  --sans:'Archivo',sans-serif; --mono:'JetBrains Mono',monospace;
  /* one motion system for everything */
  --ease:cubic-bezier(.4,0,.2,1); --dur:.55s;
}
html{scroll-behavior:smooth;scrollbar-gutter:stable}
body{font-family:var(--sans);background:var(--ivory);color:var(--ink);font-size:15px;line-height:1.7;font-weight:300;-webkit-font-smoothing:antialiased}
.grid{max-width:1240px;margin:0 auto;padding:0 2.5rem}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
img{display:block}
:focus-visible{outline:2px solid var(--bronze);outline-offset:3px}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
}

/* ═══════════════ TOP BAR ═══════════════ */
header{position:sticky;top:0;background:rgba(246,241,231,.94);backdrop-filter:blur(8px);z-index:40;border-bottom:2px solid var(--ink)}
.hd{display:flex;justify-content:space-between;align-items:end;padding:1.1rem 0}
.hd-id{font-family:var(--mono);font-size:.64rem;color:var(--warm-gray)}
.hd-name{display:block;text-align:left;font-size:1.25rem;font-weight:800;text-transform:uppercase;letter-spacing:-.02em;transition:color .2s}
.hd-name:hover{color:var(--bronze)}
nav{display:flex;gap:1.7rem;font-family:var(--mono);font-size:.68rem;text-transform:uppercase;padding-bottom:.2rem}
nav a{color:var(--ink);text-decoration:none;border-bottom:2px solid transparent;padding-bottom:2px}
nav a:hover{border-color:var(--bronze)}

/* ═══════════════ HERO ═══════════════ */
.hero{display:grid;grid-template-columns:1.25fr 1fr;border-bottom:2px solid var(--ink)}
.hero-l{padding:4.2rem 3rem 4rem 0;border-right:1px solid var(--ink)}
.hero-kicker{font-family:var(--mono);font-size:.68rem;color:var(--clay);margin-bottom:1.3rem}
.hero h1{font-size:clamp(2.5rem,5vw,4.2rem);font-weight:800;line-height:.98;letter-spacing:-.03em;text-transform:uppercase}
.hero h1 .alt{color:transparent;-webkit-text-stroke:1.5px var(--ink)}
.hero-l p{margin-top:1.6rem;max-width:50ch;color:var(--warm-gray);font-size:.94rem}
.hero-r{padding:4.2rem 0 4rem 3rem;font-family:var(--mono);font-size:.72rem;display:flex;flex-direction:column;justify-content:center}
.spec{display:flex;justify-content:space-between;align-items:baseline;padding:.6rem 0;border-bottom:1px solid var(--hair);gap:1rem}
.spec:first-child{border-top:1px solid var(--hair)}
.spec dt{color:var(--warm-gray);display:flex;align-items:center;gap:.5rem;white-space:nowrap}
.spec dt i{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.spec dd{text-align:right}
.hero-contact{margin-top:1.4rem;display:flex;gap:1.4rem;font-size:.66rem;flex-wrap:wrap}
.hero-contact a{color:var(--warm-gray);text-decoration:none}
.hero-contact a:hover{color:var(--ink)}

/* ═══════════════ INDEX HEAD + FILTERS ═══════════════ */
.idx-label{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding:2.4rem 0 .85rem;flex-wrap:wrap;gap:.8rem}
.idx-label h2{font-size:.8rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase}
.filters{display:flex;gap:1.6rem;align-items:baseline;flex-wrap:wrap}
.f-btn{font-family:var(--mono);font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--warm-gray);display:flex;align-items:center;gap:.45rem;padding-bottom:.2rem;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
.f-btn i{width:7px;height:7px;border-radius:50%;background:var(--fc,var(--warm-gray));opacity:.85}
.f-btn small{font-size:.58rem;color:var(--warm-gray);opacity:.75}
.f-btn:hover{color:var(--ink)}
.f-btn.on{color:var(--ink);border-bottom-color:var(--fc,var(--ink))}

/* ═══════════════ STRIPS ═══════════════ */
.strip{border-bottom:1px solid var(--ink);scroll-margin-top:3.6rem} /* margin = sticky header height */
.strip-bar{position:relative;display:block;width:100%;height:var(--strip-h,158px);overflow:hidden;text-align:left;transition:height var(--dur) var(--ease)}
.strip-bar img.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.55) brightness(.96);transform:scale(1.01);transition:filter .5s,opacity .5s,transform 2.2s cubic-bezier(.2,0,.2,1)}
.strip-bar img.cover.contain{object-fit:contain;padding:.7rem 24%;background:var(--ivory2)}
.strip-bar .scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(33,30,25,.55) 0%,rgba(33,30,25,.18) 38%,rgba(33,30,25,0) 65%);transition:opacity .5s}
.strip-bar:hover img.cover{filter:saturate(1) brightness(1);transform:scale(1.04)}
.strip-bar .edge{position:absolute;left:0;top:0;bottom:0;width:3px;z-index:3;background:var(--acc,var(--bronze));transition:opacity .5s}
/* text-only cover (WIP / no image) */
.strip-bar.no-img{background:var(--ivory2)}
.strip-bar.no-img .scrim{display:none}
.strip-bar.no-img .ghost{position:absolute;right:2rem;top:50%;transform:translateY(-50%);font-size:4.4rem;font-weight:800;letter-spacing:-.04em;color:transparent;-webkit-text-stroke:1px var(--hair);line-height:1;pointer-events:none}
.strip-bar.no-img .strip-info{color:var(--ink)}
.strip-bar.no-img .strip-tag{border-color:var(--ink);color:var(--ink)}
.strip-bar.no-img .strip-year{color:var(--warm-gray)}
.strip-bar.no-img .strip-cue{color:var(--warm-gray)}
.strip-bar.no-img .strip-info{background:none;padding:0;backdrop-filter:none}

/* skinny dark band, inset evenly from both tab edges, floating above the
   bottom edge so the image colour shows below it */
.strip-info{position:absolute;left:1.1rem;right:1.1rem;bottom:1.05rem;z-index:2;color:#F6F1E7;display:flex;align-items:center;gap:1.4rem;transition:bottom .5s;flex-wrap:wrap;background:rgba(20,17,12,.55);backdrop-filter:blur(3px);padding:.32rem 1.1rem;border-radius:3px}
.strip-num{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;color:rgba(246,241,231,.7)}
.strip-tag{font-family:var(--mono);font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;padding:.34rem .9rem;border:1px solid rgba(246,241,231,.55);border-radius:99px;backdrop-filter:blur(2px);transition:opacity .4s}
.strip-title{font-size:1.3rem;font-weight:800;letter-spacing:-.015em;text-transform:uppercase;transition:font-size .4s}
/* thin divider between the two halves of a strip title (replaces the em dash) */
.strip-sep{display:inline-block;width:1px;height:.92em;margin:0 .62em;vertical-align:-.06em;background:currentColor;opacity:.42}
.strip-year{font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;color:rgba(246,241,231,.75);transition:opacity .4s}
/* inline "open" cue, pushed to the band's right edge */
.strip-cue{margin-left:auto;font-family:var(--mono);font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(246,241,231,.8);opacity:0;transform:translateX(-6px);transition:opacity .3s,transform .3s;display:inline-flex;align-items:center;gap:.5em}
/* CSS-drawn down chevron — aligns to the cap height of the text, no glyph drift */
.strip-cue-arrow{width:.55em;height:.55em;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin-top:-.28em;flex-shrink:0}
.strip-bar:hover .strip-cue{opacity:1;transform:none}

/* open: bar becomes a slim banner */
.strip.open .strip-bar{--strip-h:96px}
.strip.open .strip-bar img.cover{filter:saturate(1)}
.strip.open .strip-cue{opacity:0!important}

/* collapsed (filtered-out): slim + toned down */
.strip.dim .strip-bar{--strip-h:46px}
.strip.dim .strip-bar img.cover{filter:saturate(0) brightness(1.06) contrast(.82);opacity:.35}
.strip.dim .strip-bar .scrim{opacity:.25}
.strip.dim .strip-bar .edge{opacity:.3}
.strip.dim .strip-info{bottom:50%;transform:translateY(50%);color:var(--warm-gray);background:none;backdrop-filter:none;padding:0}
.strip.dim .strip-title{font-size:.74rem;font-weight:600;letter-spacing:.08em;color:var(--warm-gray);text-transform:uppercase}
.strip.dim .strip-tag,.strip.dim .strip-year,.strip.dim .strip-cue{display:none}
.strip.dim .strip-num{color:var(--warm-gray)}
.strip.dim .strip-bar:hover img.cover{opacity:.6;transform:none}
.strip.dim .strip-bar.no-img .ghost{opacity:.4}

/* ═══════════════ EXPANDABLE REGIONS (panel + full) ═══════════════
   grid-rows 0fr→1fr: smooth, content-sized, never clips. */
.xp{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--dur) var(--ease)}
.xp>div{overflow:hidden}
.strip.open .panel.xp{grid-template-rows:1fr}
.strip.full-open .full.xp{grid-template-rows:1fr;transition-duration:.8s}

/* ── summary panel ── */
.panel-in{min-height:60vh;display:grid;grid-template-columns:1.05fr .95fr;gap:4rem;padding:3.2rem 0 3rem}
.panel-in.solo{grid-template-columns:1fr;min-height:0}
.panel-kicker{font-family:var(--mono);font-size:.62rem;letter-spacing:.26em;text-transform:uppercase;color:var(--acc,var(--bronze));margin-bottom:1.3rem}
.panel h3{font-size:clamp(1.5rem,2.3vw,2.1rem);font-weight:800;line-height:1.12;letter-spacing:-.02em;text-transform:uppercase;margin-bottom:1.2rem;max-width:24ch}
.panel h3 em{font-style:normal;color:var(--acc,var(--bronze))}
.panel-sum{font-size:.93rem;color:#494337;max-width:54ch}
.panel-sum+.panel-sum{margin-top:.9rem}
.kws{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1.4rem}
.kws span{font-family:var(--mono);font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--hair);border-radius:2px;padding:.22rem .55rem;color:var(--warm-gray)}
.panel-facts{display:flex;gap:2.8rem;margin-top:1.8rem;padding-top:1.6rem;border-top:1px solid var(--hair);flex-wrap:wrap}
.fact b{font-size:1.6rem;font-weight:800;display:block;line-height:1.1;letter-spacing:-.02em}
.fact small{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--warm-gray)}
.panel-cta{margin-top:2.4rem;display:flex;gap:1rem;align-items:center}
.btn-pill{font-family:var(--mono);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;padding:.85rem 2rem;border:1px solid var(--ink);border-radius:99px;transition:background .25s,color .25s;text-decoration:none;color:var(--ink);display:inline-block}
.btn-pill:hover{background:var(--ink);color:var(--ivory)}
.btn-quiet{font-family:var(--mono);font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--warm-gray)}
.btn-quiet:hover{color:var(--ink)}
.wip-flag{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--bronze);border:1px dashed var(--bronze);border-radius:99px;padding:.6rem 1.4rem;margin-top:2rem}

/* panel image stage: hero + thumb swap — framed like a figure card */
.stage{display:flex;flex-direction:column;gap:.5rem;align-self:stretch;min-height:0}
.stage-hero{flex:1;min-height:300px;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--hair);border-left:3px solid var(--acc,var(--bronze));background:#fff;cursor:zoom-in;transition:box-shadow .2s}
.stage-hero:hover{box-shadow:0 5px 18px rgba(33,30,25,.1)}
.stage-head{display:flex;justify-content:space-between;gap:.6rem;align-items:baseline;padding:.6rem .9rem .55rem}
.stage-cap{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--warm-gray);line-height:1.5}
.stage-hint{font-family:var(--mono);font-size:.56rem;color:var(--warm-gray);white-space:nowrap;flex-shrink:0}
.stage-media{position:relative;flex:1;min-height:0;background:var(--ivory2);border-top:1px dashed var(--hair);overflow:hidden}
.stage-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s}
.stage-media img.contain{object-fit:contain;padding:1rem;background:#fff}
.stage-foot{padding:.65rem .9rem;border-top:1px solid var(--ivory2);font-size:.75rem;font-style:italic;color:#494337;line-height:1.5}
.stage-foot:empty{display:none}
.stage-foot::before{content:'→';font-style:normal;font-weight:600;color:var(--acc,var(--bronze));margin-right:.4rem}
.stage-thumbs{display:flex;gap:.5rem}
.stage-thumbs button{flex:1;aspect-ratio:4/3;max-height:84px;overflow:hidden;border:1px solid var(--hair);padding:0;opacity:.65;transition:opacity .2s,border-color .2s;background:var(--ivory2)}
.stage-thumbs button img{width:100%;height:100%;object-fit:cover}
.stage-thumbs button img.contain{object-fit:contain;padding:.3rem}
.stage-thumbs button:hover{opacity:1}
.stage-thumbs button.on{opacity:1;border-color:var(--acc,var(--bronze))}

/* ── full project ── */
.full-in{border-top:1px solid var(--hair);padding:3.2rem 0 4rem}
.full-head{margin-bottom:2.6rem}
.full-head .ey{font-family:var(--mono);font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--acc,var(--bronze));margin-bottom:.5rem}
.full-head .meta{font-size:.78rem;color:var(--warm-gray)}
.full-head .meta a{color:var(--acc,var(--bronze));text-decoration:none}
.full-head .meta a:hover{text-decoration:underline}
.full-cols{display:grid;grid-template-columns:210px minmax(0,1fr);gap:4rem}
.rail{position:sticky;top:6rem;align-self:start}
.rail a{display:flex;gap:.7rem;padding:.55rem 0;font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;color:var(--warm-gray);text-decoration:none;text-transform:uppercase;border-bottom:1px solid var(--ivory2);line-height:1.5}
.rail a:hover{color:var(--ink)}
.rail a.cur{color:var(--ink)}
.rail a b{color:var(--acc,var(--bronze));font-weight:500;flex-shrink:0}
.fchap{margin-bottom:3.4rem;scroll-margin-top:6rem}
.fchap-head{display:flex;gap:1rem;align-items:baseline;margin-bottom:1.1rem;border-bottom:1px solid var(--ink);padding-bottom:.6rem}
.fchap-head b{font-family:var(--mono);font-size:.78rem;font-weight:500;color:var(--acc,var(--bronze))}
.fchap-head h4{font-size:1.3rem;font-weight:600;letter-spacing:-.01em}
.fchap p{font-size:.91rem;color:#494337;max-width:64ch;margin-bottom:.9rem}
.fchap p strong{color:var(--ink);font-weight:600}
.fchap ul{margin-left:1.1rem;max-width:66ch}
.fchap ul li{font-size:.9rem;color:#494337;margin-bottom:.5rem}
.fchap ul li strong{color:var(--ink);font-weight:600}
.fchap .links{font-size:.8rem!important}
.fchap .links a{color:var(--acc,var(--bronze));text-decoration:none}
.fchap .links a:hover{text-decoration:underline}

/* content blocks inside chapter html */
.note{border-left:3px solid var(--acc,var(--bronze));background:color-mix(in srgb,var(--acc,var(--bronze)) 7%, var(--ivory));padding:1rem 1.3rem;margin:1.4rem 0;max-width:62ch}
.note b{font-family:var(--mono);font-size:.6rem;text-transform:uppercase;letter-spacing:.14em;color:var(--acc,var(--bronze));display:block;margin-bottom:.3rem;font-weight:500}
.note p{font-size:.87rem;color:var(--ink);margin:0;max-width:none}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;margin:1.4rem 0;max-width:64ch}
.metric{background:#fff;border:1px solid var(--hair);padding:.8rem 1rem}
.metric b{font-size:1.5rem;font-weight:800;display:block;line-height:1.15;letter-spacing:-.02em}
.metric span{font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--warm-gray)}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;margin:1.4rem 0}
.pillar{background:#fff;border:1px solid var(--hair);border-top:3px solid var(--pc,var(--bronze));padding:.9rem 1rem}
.pillar b{display:block;font-size:.95rem;font-weight:600;margin-bottom:.3rem}
.pillar span{font-size:.78rem;color:var(--warm-gray);line-height:1.55;display:block}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:1.4rem 0;max-width:64ch}
.move{display:flex;gap:.7rem;background:#fff;border:1px solid var(--hair);border-left:3px solid var(--acc,var(--bronze));padding:.7rem .9rem}
.move b{font-size:1.3rem;font-weight:800;color:var(--acc,var(--bronze));line-height:1.1}
.move span{font-size:.78rem;color:var(--warm-gray);line-height:1.55}
.move span strong{color:var(--ink);font-weight:600}
.pubs .pub{padding:1rem 0;border-bottom:1px solid var(--hair)}
.pubs .pub:first-child{border-top:1px solid var(--hair)}
.pubs .pub b{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--acc,var(--bronze));font-weight:500}
.pubs .pub p{font-size:.95rem;color:var(--ink);margin:.25rem 0 .1rem;max-width:none}
.pubs .pub i{font-size:.74rem;color:var(--warm-gray);font-style:italic;display:block}
.pubs .pub a{font-family:var(--mono);font-size:.7rem;color:var(--acc,var(--bronze));text-decoration:none}
.pubs .pub a:hover{text-decoration:underline}

/* figure cards */
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:.8rem;margin:1.6rem 0}
.figcard{border:1px solid var(--hair);border-left:3px solid var(--facc,var(--hair));background:#fff;text-align:left;padding:0;display:flex;flex-direction:column;cursor:zoom-in;transition:box-shadow .2s,transform .15s}
.figcard:hover{box-shadow:0 5px 18px rgba(33,30,25,.1);transform:translateY(-2px)}
.figcard.wide{grid-column:1/-1}
/* head & foot are COERCED to a fixed height so every card in a row is
   structurally identical — same top/bottom text spacing, images perfectly
   aligned. Long captions/takeaways clamp rather than push the layout. */
.figcard .fc-head{padding:.7rem .9rem;height:4.6rem;flex:0 0 auto;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.figcard .fc-title{font-size:.85rem;font-weight:600}
.figcard .fc-cap{font-family:var(--mono);font-size:.6rem;color:var(--warm-gray);margin-top:.6rem;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.figcard .fc-media{background:var(--ivory2);border-top:1px dashed var(--hair);flex:0 0 auto}
.figcard .fc-media img{width:100%;height:210px;object-fit:cover}
.figcard.wide .fc-media img{height:330px}
.figcard .fc-media img.contain{object-fit:contain;padding:.7rem;background:#fff}
.figcard .fc-foot{display:flex;justify-content:space-between;gap:.6rem;align-items:center;padding:.6rem .9rem;border-top:1px solid var(--ivory2);font-size:.72rem;flex:0 0 auto;height:3rem;overflow:hidden}
.figcard .fc-take{font-style:italic;color:#494337;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.figcard .fc-take::before{content:'→';font-style:normal;font-weight:600;color:var(--facc,var(--bronze));margin-right:.4rem}
.figcard .fc-hint{font-family:var(--mono);font-size:.56rem;color:var(--warm-gray);white-space:nowrap;flex-shrink:0}

/* chart cards */
.chartcard{border:1px solid var(--hair);border-left:3px solid var(--acc,var(--bronze));background:#fff;margin:1.2rem 0;padding:1rem 1.2rem}
.chartcard .cc-title{font-size:.95rem;font-weight:600}
.chartcard .cc-sub{font-family:var(--mono);font-size:.62rem;color:var(--warm-gray);margin:.25rem 0 .8rem;line-height:1.6}
.chartcard .cc-wrap{position:relative;height:260px;background:var(--ivory2);border:1px solid var(--ivory2);padding:8px}
.chartcard canvas{position:absolute;inset:8px;width:calc(100% - 16px)!important;height:calc(100% - 16px)!important}
.chartcard .cc-foot{display:flex;justify-content:space-between;gap:.8rem;align-items:baseline;padding-top:.6rem;font-size:.74rem}
.chartcard .cc-take{font-style:italic;color:#494337}
.chartcard .cc-take::before{content:'→';font-style:normal;font-weight:600;color:var(--acc,var(--bronze));margin-right:.4rem}
.chartcard .cc-howto{font-family:var(--mono);font-size:.58rem;color:var(--warm-gray);white-space:nowrap}
.viab{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.9rem}
.viab-row{display:flex;align-items:center;gap:.8rem;background:var(--ivory);border:1px solid var(--hair);border-left:3px solid var(--vc);border-radius:4px;padding:.45rem .8rem}
.viab-row .vn{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;flex:0 0 64px}
.viab-row .vs{font-size:1.35rem;font-weight:800;color:var(--vc);line-height:1}
.viab-row .vs small{font-size:.7rem;color:var(--warm-gray);font-weight:400}
.viab-row .vb{flex:1;height:8px;background:var(--ivory2);border-radius:4px;overflow:hidden}
.viab-row .vb i{display:block;height:100%;background:var(--vc);border-radius:4px}
.viab-row .vstat{font-family:var(--mono);font-size:.58rem;color:var(--warm-gray);white-space:nowrap}

/* floating close – fixed bottom-right, hollow pill, visible while a project is fully open */
.float-close{position:fixed;right:1.1rem;bottom:1.1rem;z-index:80;font-family:var(--mono);font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;background:var(--ivory);color:var(--ink);border:1px solid var(--ink);border-radius:99px;padding:.85rem 1.7rem;box-shadow:0 4px 16px rgba(33,30,25,.14);opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .3s,transform .3s,background .25s,color .25s}
.float-close.show{opacity:1;pointer-events:auto;transform:none}
.float-close:hover{background:var(--ink);color:var(--ivory)}

/* ═══════════════ LIGHTBOX ═══════════════ */
.lb{position:fixed;inset:0;z-index:999;background:rgba(18,15,10,.86);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.lb.open{opacity:1;pointer-events:auto}
.lb-frame{position:relative;cursor:grab;touch-action:none;user-select:none}
.lb-frame:active{cursor:grabbing}
.lb-frame img{max-width:88vw;max-height:82vh;width:auto;height:auto;pointer-events:none;background:var(--ivory);border:1px solid var(--hair);border-radius:8px}
.lb-cap{position:absolute;left:50%;transform:translateX(-50%);bottom:1.4rem;color:#EDE5D5;font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;text-align:center;max-width:80vw;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.lb-x{position:absolute;top:1rem;right:1.4rem;color:#EDE5D5;font-size:1.6rem;opacity:.75;padding:.4rem .7rem}
.lb-x:hover{opacity:1}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);color:#EDE5D5;font-size:2.2rem;width:2.6rem;height:3rem;opacity:.55;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.lb-nav:hover{opacity:1}
.lb-nav.off{opacity:0;pointer-events:none}
.lb-prev{left:.7rem}.lb-next{right:.7rem}
.lb-n{position:absolute;top:1.3rem;left:1.6rem;color:#EDE5D5;font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;opacity:.6}

/* ═══════════════ CTA + FOOTER ═══════════════ */
.cta{padding:5.5rem 0;text-align:center;border-top:2px solid var(--ink)}
.cta h3{font-size:1.45rem;font-weight:300;max-width:38ch;margin:0 auto;line-height:1.45}
.cta h3 em{font-style:italic;font-weight:400;color:var(--bronze)}
.cta-row{margin-top:1.8rem;display:flex;gap:.9rem;justify-content:center;flex-wrap:wrap}
footer{border-top:1px solid var(--hair);padding:1.4rem 0 2.4rem;display:flex;justify-content:space-between;font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--warm-gray);flex-wrap:wrap;gap:.4rem}
footer a{color:var(--warm-gray);text-decoration:none}
footer a:hover{color:var(--ink)}

/* ═══════════════ MOBILE ═══════════════ */
@media(max-width:880px){
  .grid{padding:0 1.3rem}
  .hd{align-items:center}
  .hd-id{display:none}
  nav{gap:1.1rem}
  .hero{grid-template-columns:1fr}
  .hero-l{border-right:none;border-bottom:1px solid var(--ink);padding:2rem 0}
  .hero h1{font-size:clamp(2rem,7vw,2.8rem)}
  .hero-l p{margin-top:1.1rem}
  .hero-r{padding:1.6rem 0 2rem}
  .filters{gap:.9rem}
  /* shorter strips so more fit on screen */
  .strip-bar{--strip-h:120px}
  .strip.open .strip-bar{--strip-h:84px}
  .strip-info{left:.8rem;right:.8rem;gap:.5rem .9rem;padding:.3rem .8rem}
  .strip-title{font-size:1.05rem}
  .strip-cue{display:none}
  .panel-in{grid-template-columns:1fr;gap:1.6rem;padding:2.4rem 0 2.2rem}
  .panel h3{font-size:clamp(1.4rem,4.5vw,1.8rem)}
  .stage-hero{min-height:200px}
  .full-in{padding:2.4rem 0 3rem}
  .full-cols{grid-template-columns:1fr;gap:1.6rem}
  .rail{position:static;display:flex;flex-wrap:wrap;gap:.2rem 1.2rem;border-bottom:1px solid var(--hair);padding-bottom:.8rem}
  .rail a{border:none;padding:.3rem 0}
  .fchap{margin-bottom:2.4rem}
  .fchap-head h4{font-size:1.1rem}
  .metrics{grid-template-columns:1fr 1fr}
  .pillars{grid-template-columns:1fr}
  .moves{grid-template-columns:1fr}
  .figs{grid-template-columns:1fr 1fr}
  .figcard.wide{grid-column:1/-1}
  .figcard .fc-media img{height:140px}
  .figcard.wide .fc-media img{height:200px}
  .strip-bar.no-img .ghost{font-size:2.6rem;right:1.2rem}
  .cta{padding:3.5rem 0}
}
@media(max-width:560px){
  .grid{padding:0 1.1rem}
  .hero h1{font-size:clamp(1.9rem,8.5vw,2.4rem)}
  .hero-l p{font-size:.88rem}
  /* shorter still on phones */
  .strip-bar{--strip-h:104px}
  .strip.open .strip-bar{--strip-h:76px}
  .strip-title{font-size:.95rem}
  .strip-num{display:none}
  .panel-in{padding:2rem 0 1.8rem}
  .panel-sum{font-size:.88rem}
  .panel-facts{gap:1.6rem;margin-top:1.4rem;padding-top:1.2rem}
  .fact b{font-size:1.3rem}
  .stage-hero{min-height:170px}
  .fchap p,.fchap ul li{font-size:.88rem;line-height:1.65}
  .fchap-head h4{font-size:1.02rem}
  .figs{grid-template-columns:1fr}
  /* single column: no row-alignment needed, let head/foot size to content */
  .figcard .fc-head{height:auto;min-height:3.4rem}
  .figcard .fc-foot{height:auto;min-height:2.4rem}
  .figcard .fc-media img,.figcard.wide .fc-media img{height:180px}
  .metrics{gap:.45rem}
  .metric b{font-size:1.25rem}
  .cta h3{font-size:1.2rem}
}
</style>
</head>
<body>

<header><div class="grid hd">
  <div>
    <div class="hd-id" id="hdId"></div>
    <button class="hd-name" id="hdName" type="button" aria-label="Back to index"></button>
  </div>
  <nav id="hdNav"></nav>
</div></header>

<section class="grid hero" id="hero"></section>

<main class="grid">
  <div class="idx-label">
    <h2>Index – Selected Work</h2>
    <div class="filters" id="filters"></div>
  </div>
  <div id="strips"></div>
</main>

<section class="grid cta" id="contact">
  <h3 id="ctaText"></h3>
  <div class="cta-row" id="ctaRow"></div>
</section>
<footer class="grid" id="footer"></footer>

<!-- lightbox -->
<button class="float-close" id="floatClose">✕ &nbsp;Close project</button>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Image viewer">
  <span class="lb-n" id="lbN"></span>
  <button class="lb-x" id="lbX" aria-label="Close">✕</button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous">‹</button>
  <button class="lb-nav lb-next" id="lbNext" aria-label="Next">›</button>
  <div class="lb-frame" id="lbFrame"><img id="lbImg" alt=""></div>
  <div class="lb-cap" id="lbCap"></div>
</div>

<script src="projects.js"></script>
<script>
/* ═══════════════ SETUP ═══════════════ */
const D = window.SITE_DATA;
const CATS = D.categories;
/* image paths in projects.js are root-relative ("images/…"); site files live at repo root */
const src = p => p;
const esc = s => String(s).replace(/"/g, '&quot;');

/* ═══════════════ HERO / CHROME ═══════════════ */
const I = D.identity;
const C = I.contact;
const telHref = p => 'tel:' + p.replace(/[^+\d]/g, '');
document.getElementById('hdId').textContent = I.dossier;
document.getElementById('hdName').textContent = I.name;
document.getElementById('hdName').addEventListener('click', closeAll);
/* header nav = the contact links (replaces Index / Contact buttons) */
document.getElementById('hdNav').innerHTML = `
  <a href="mailto:${C.email}">Email</a>
  <a href="${C.linkedin}" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>
  <a href="${src(C.cv)}" target="_blank" rel="noopener noreferrer">CV ↗</a>
  <a href="${telHref(C.phone)}">Phone</a>`;
document.getElementById('hero').innerHTML = `
  <div class="hero-l">
    <div class="hero-kicker">${I.kicker.replace(/&/g,'&amp;').replace(/&amp;amp;/g,'&amp;')}</div>
    <h1>${I.headline}</h1>
    <p>${I.statement}</p>
  </div>
  <dl class="hero-r">
    ${I.specs.map(s => `<div class="spec"><dt>${s.cat ? `<i style="background:${CATS[s.cat].color}"></i>` : ''}${s.dt}</dt><dd>${s.dd}</dd></div>`).join('')}
    <div class="hero-contact">
      <a href="mailto:${C.email}">EMAIL</a>
      <a href="${C.linkedin}" target="_blank" rel="noopener noreferrer">LINKEDIN ↗</a>
      <a href="${src(C.cv)}" target="_blank" rel="noopener noreferrer">CV ↗</a>
      <a href="${telHref(C.phone)}">${C.phone}</a>
    </div>
  </dl>`;
document.getElementById('ctaText').innerHTML = I.cta.replace(/research experience/,'<em>research experience</em>').replace(/love of architecture/,'<em>love of architecture</em>');
document.getElementById('ctaRow').innerHTML = `
  <a class="btn-pill" href="mailto:${C.email}">Email me</a>
  <a class="btn-pill" href="${C.linkedin}" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>
  <a class="btn-pill" href="${src(C.cv)}" target="_blank" rel="noopener noreferrer">CV ↗</a>`;
document.getElementById('footer').innerHTML = `
  <span>${I.name} · Architectural R&amp;D · ${new Date().getFullYear()}</span>
  <span><a href="${telHref(C.phone)}">${C.phone}</a> · <a href="mailto:${C.email}">${C.email}</a> · <a href="${src(C.cv)}" target="_blank" rel="noopener noreferrer">CV ↗</a></span>`;

/* ═══════════════ RENDER HELPERS ═══════════════ */
function figCard(f, pid, gi) {
  const cls = (f.wide ? ' wide' : '');
  const accent = f.accent ? `--facc:${f.accent};` : '';
  return `<button class="figcard${cls}" style="${accent}" data-lb="${pid}" data-gi="${gi}">
    <span class="fc-head"><span class="fc-title">${f.title || ''}</span><span class="fc-cap">${f.cap || ''}</span></span>
    <span class="fc-media"><img loading="lazy" decoding="async" src="${src(f.src)}" alt="${esc(f.title || f.cap || '')}" class="${f.contain ? 'contain' : ''}" ${f.pos ? `style="object-position:${f.pos}"` : ''}></span>
    <span class="fc-foot">${f.takeaway ? `<span class="fc-take">${f.takeaway}</span>` : '<span></span>'}<span class="fc-hint">↗ expand</span></span>
  </button>`;
}
function chartCard(c) {
  const viab = c.viab ? `<div class="viab">${c.viab.map(v => `
    <div class="viab-row" style="--vc:${v.color}">
      <span class="vn">${v.name}</span><span class="vs">${v.score}<small>${v.denom}</small></span>
      <span class="vb"><i style="width:${v.pct}%"></i></span><span class="vstat">${v.stat}</span>
    </div>`).join('')}</div>` : '';
  return `<div class="chartcard">
    <div class="cc-title">${c.title}</div>
    <div class="cc-sub">${c.sub}</div>
    ${viab}
    <div class="cc-wrap"><canvas data-chart="${c.id}"></canvas></div>
    <div class="cc-foot"><span class="cc-take">${c.takeaway}</span><span class="cc-howto">${c.howto}</span></div>
  </div>`;
}

/* gallery registry: pid → [{src,cap}] for the lightbox */
const GALLERIES = {};

function renderStrip(p, idx) {
  const cat = CATS[p.cat];
  const num = String(idx + 1).padStart(3, '0');
  const gallery = [];
  /* cover */
  let coverHtml;
  if (p.cover) {
    coverHtml = `<img class="cover ${p.cover.contain ? 'contain' : ''}" loading="${idx < 2 ? 'eager' : 'lazy'}" decoding="async" src="${src(p.cover.src)}" alt="" ${p.cover.pos ? `style="object-position:${p.cover.pos}"` : ''}><span class="scrim"></span>`;
  } else {
    coverHtml = `<span class="ghost">${num}</span>`;
  }
  /* summary stage images */
  const sImgs = (p.summary.images || []);
  sImgs.forEach(im => gallery.push({ src: im.src, cap: im.cap || p.stripTitle }));
  const stage = sImgs.length ? `
    <div class="stage">
      <figure class="stage-hero" data-lb="${p.id}" data-gi="0" role="button" tabindex="0">
        <span class="stage-head"><span class="stage-cap" id="stagecap-${p.id}">${sImgs[0].cap || ''}</span><span class="stage-hint">↗ expand</span></span>
        <span class="stage-media"><img id="stagehero-${p.id}" src="${src(sImgs[0].src)}" alt="${esc(sImgs[0].cap || '')}" class="${sImgs[0].contain ? 'contain' : ''}" ${sImgs[0].pos ? `style="object-position:${sImgs[0].pos}"` : ''}></span>
        <span class="stage-foot" id="stagetake-${p.id}">${sImgs[0].take || ''}</span>
      </figure>
      ${sImgs.length > 1 ? `<div class="stage-thumbs">${sImgs.map((im, i) => `
        <button class="${i === 0 ? 'on' : ''}" data-stage="${p.id}" data-i="${i}" aria-label="Show image ${i + 1}">
          <img loading="lazy" decoding="async" src="${src(im.src)}" alt="" class="${im.contain ? 'contain' : ''}">
        </button>`).join('')}</div>` : ''}
    </div>` : '';
  /* full chapters */
  let fullHtml = '';
  if (p.chapters) {
    const chaps = p.chapters.map(ch => {
      let figs = '';
      if (ch.figures) {
        figs = `<div class="figs">${ch.figures.map(f => {
          const gi = gallery.length;
          gallery.push({ src: f.src, cap: (f.title ? f.title + ': ' : '') + (f.cap || '') });
          return figCard(f, p.id, gi);
        }).join('')}</div>`;
      }
      const charts = ch.charts ? ch.charts.map(chartCard).join('') : '';
      return `<section class="fchap" id="ch-${p.id}-${ch.num}">
        <div class="fchap-head"><b>${ch.num}</b><h4>${ch.title}</h4></div>
        ${ch.html}${figs}${charts}
      </section>`;
    }).join('');
    fullHtml = `<div class="full xp"><div><div class="full-in">
      <div class="full-head">
        <div class="ey">${p.eyebrow}</div>
        <div class="meta">${p.meta}</div>
      </div>
      <div class="full-cols">
        <aside class="rail" data-rail="${p.id}">
          ${p.chapters.map(ch => `<a href="#ch-${p.id}-${ch.num}" data-ch="ch-${p.id}-${ch.num}"><b>${ch.num}</b>${ch.title.split(/[—:]/)[0].trim()}</a>`).join('')}
        </aside>
        <div>${chaps}</div>
      </div>
    </div></div></div>`;
  }
  GALLERIES[p.id] = gallery;
  /* panel */
  const facts = (p.summary.facts || []).length ? `<div class="panel-facts">${p.summary.facts.map(f => `<div class="fact"><b>${f.v}</b><small>${f.l}</small></div>`).join('')}</div>` : '';
  const kws = (p.kw || []).length ? `<div class="kws">${p.kw.map(k => `<span>${k}</span>`).join('')}</div>` : '';
  const cta = p.chapters
    ? `<div class="panel-cta"><button class="btn-pill" data-full="${p.id}">Full project</button></div>`
    : `<div><span class="wip-flag">◷ &nbsp;${p.wipNote || 'Documentation in preparation.'}</span></div>`;
  return `<article class="strip" id="strip-${p.id}" data-id="${p.id}" data-cat="${p.cat}" style="--acc:${cat.color}">
    <button class="strip-bar${p.cover ? '' : ' no-img'}" data-toggle="${p.id}" aria-expanded="false">
      ${coverHtml}
      <span class="edge"></span>
      <span class="strip-info">
        <span class="strip-num">${num}</span>
        <span class="strip-tag">${cat.label}</span>
        <span class="strip-title">${p.stripTitle.replace(/ — /g, '<span class="strip-sep" aria-hidden="true"></span>')}</span>
        <span class="strip-year">${p.year}</span>
        <span class="strip-cue">Open <span class="strip-cue-arrow" aria-hidden="true"></span></span>
      </span>
    </button>
    <div class="panel xp"><div><div class="panel-in${stage ? '' : ' solo'}">
      <div>
        <div class="panel-kicker">${p.summary.kicker}</div>
        <h3>${p.summary.headline}</h3>
        ${p.summary.paras.map(t => `<p class="panel-sum">${t}</p>`).join('')}
        ${kws}${facts}${cta}
      </div>
      ${stage}
    </div></div></div>
    ${fullHtml}
  </article>`;
}

document.getElementById('strips').innerHTML = D.projects.map(renderStrip).join('');

/* filters with counts */
const counts = {};
D.projects.forEach(p => counts[p.cat] = (counts[p.cat] || 0) + 1);
document.getElementById('filters').innerHTML =
  `<button class="f-btn on" data-f="all">All <small>${D.projects.length}</small></button>` +
  Object.keys(CATS).map(c =>
    `<button class="f-btn" data-f="${c}" style="--fc:${CATS[c].color}"><i></i>${CATS[c].label} <small>${counts[c] || 0}</small></button>`
  ).join('');

/* ═══════════════ BEHAVIOR ═══════════════ */
let filter = 'all';
const strips = () => document.querySelectorAll('.strip');

function applyDim() {
  strips().forEach(s => s.classList.toggle('dim', filter !== 'all' && s.dataset.cat !== filter));
}
/* graceful scroll tween – replaces the browser's abrupt smooth-scroll.
   Driven by wall-clock time; falls back to setTimeout when the tab is
   hidden (rAF is suspended there). A new glide cancels the previous one. */
let glideGen = 0, gliding = false;
function glideTo(targetY, dur, onDone) {
  const gen = ++glideGen;
  gliding = true;
  const start = window.scrollY;
  const max = document.documentElement.scrollHeight - window.innerHeight;
  const dist = Math.min(Math.max(targetY, 0), max) - start;
  if (Math.abs(dist) < 2) { gliding = false; if (onDone) onDone(); return; }
  dur = dur || 800;
  const t0 = performance.now();
  const ease = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; /* easeInOutCubic */
  (function step() {
    if (gen !== glideGen) return;        /* superseded by a newer glide or a manual cancel */
    const p = Math.min(1, (performance.now() - t0) / dur);
    /* behavior:'instant' so the CSS scroll-behavior:smooth doesn't fight the tween */
    window.scrollTo({ top: start + dist * ease(p), behavior: 'instant' });
    if (p < 1) { document.hidden ? setTimeout(step, 16) : requestAnimationFrame(step); }
    else { gliding = false; if (onDone) onDone(); }
  })();
}
/* a manual scroll/keypress during a glide hands control back to the user
   (bumps glideGen so the running step() bails; onDone is skipped) */
function cancelGlide() { if (gliding) { gliding = false; glideGen++; } }
['wheel', 'touchmove', 'pointerdown'].forEach(ev =>
  window.addEventListener(ev, cancelGlide, { passive: true }));
window.addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','PageUp','PageDown','Home','End',' ','Spacebar'].includes(e.key)) cancelGlide();
}, { passive: true });
const headerH = () => document.querySelector('header').offsetHeight;
const stripTopY = s => s.getBoundingClientRect().top + window.scrollY - headerH();
const glideToStrip = (s, dur, onDone) => glideTo(stripTopY(s), dur, onDone);

function clearFull() {
  document.querySelectorAll('.strip.full-open').forEach(s => s.classList.remove('full-open'));
  document.querySelectorAll('[data-full]').forEach(b => b.textContent = 'Full project');
  document.getElementById('floatClose').classList.remove('show');
}
function setFilter(cat, btn) {
  filter = cat;
  document.querySelectorAll('.f-btn').forEach(b => b.classList.toggle('on', b === btn));
  clearFull();
  strips().forEach(s => { s.classList.remove('open'); barExpanded(s, false); });
  applyDim();
}
function barExpanded(s, v) {
  const bar = s.querySelector('.strip-bar');
  if (bar) bar.setAttribute('aria-expanded', String(v));
}
function openProject(id, full, push) {
  const s = document.getElementById('strip-' + id);
  if (!s) return;
  /* B6: if another project is open ABOVE the target, collapsing it shifts the
     page up and the user "feels" the old one close. Capture the target's
     viewport-top before the collapse, then compensate scroll instantly so the
     target stays visually pinned — the glide that follows feels clean. */
  const hadOpen = !!document.querySelector('.strip.open:not(#strip-' + id + '), .strip.full-open:not(#strip-' + id + ')');
  const topBefore = s.getBoundingClientRect().top;
  clearFull();
  strips().forEach(x => { if (x !== s) { x.classList.remove('open'); barExpanded(x, false); } });
  applyDim();
  s.classList.remove('dim');
  s.classList.add('open');
  if (full && s.querySelector('.full')) {
    s.classList.add('full-open');
    const b = s.querySelector('[data-full]');
    if (b) b.textContent = 'Minimize project';
    document.getElementById('floatClose').classList.add('show');
  }
  barExpanded(s, true);
  if (push !== false) history.pushState({ p: id }, '', '#' + id);
  /* instantly absorb the collapse-induced shift so there's no visible lurch */
  if (hadOpen) {
    const topAfter = s.getBoundingClientRect().top;
    const delta = topAfter - topBefore;
    if (Math.abs(delta) > 1) window.scrollTo({ top: window.scrollY + delta, behavior: 'instant' });
  }
  /* glide so the tab's top edge lands at the top of the view */
  setTimeout(() => glideToStrip(s, 850), hadOpen ? 0 : 100);
  if (id === 'research') loadCharts();
}
function closeProject(id, push) {
  const s = document.getElementById('strip-' + id);
  clearFull();
  if (s) { s.classList.remove('open'); barExpanded(s, false); }
  applyDim();
  if (push !== false && location.hash === '#' + id) history.pushState({}, '', location.pathname + location.search);
}
/* close gesture: only scroll up if the strip's top has scrolled ABOVE the
   header (off the top of the view). If the banner is already on screen, just
   collapse in place — no needless upward jump (TASKS #11). */
function closeWithScroll(s) {
  const top = s.getBoundingClientRect().top;
  if (top < headerH() + 1) glideToStrip(s, 850, () => closeProject(s.dataset.id));
  else closeProject(s.dataset.id);
}
function closeAll() {
  clearFull();
  strips().forEach(s => { s.classList.remove('open'); barExpanded(s, false); });
  applyDim();
  if (location.hash) history.pushState({}, '', location.pathname + location.search);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.body.addEventListener('click', e => {
  /* chapter-rail link: glide to the chapter, never touch the hash (a hash
     change here can trip syncFromHash and collapse the open project) */
  const railLink = e.target.closest('.rail a[data-ch]');
  if (railLink) {
    e.preventDefault();
    const sec = document.getElementById(railLink.dataset.ch);
    if (sec) glideTo(sec.getBoundingClientRect().top + window.scrollY - headerH() - 8, 650);
    return;
  }
  const t = e.target.closest('[data-toggle],[data-full],.f-btn,[data-stage],[data-lb]');
  if (!t) return;
  if (t.dataset.toggle) {
    const s = document.getElementById('strip-' + t.dataset.toggle);
    s.classList.contains('open') ? closeWithScroll(s) : openProject(t.dataset.toggle);
  } else if (t.dataset.full) {
    /* toggle: Full project ↔ Minimize project */
    const s = document.getElementById('strip-' + t.dataset.full);
    const opening = !s.classList.contains('full-open');
    if (opening) {
      s.classList.add('full-open');
      t.textContent = 'Minimize project';
      document.getElementById('floatClose').classList.add('show');
      if (t.dataset.full === 'research') loadCharts();
      /* gentle nudge downward – show the full view opened, user scrolls on */
      setTimeout(() => glideTo(window.scrollY + 520, 1100), 250);
    } else {
      /* minimize: scroll to the banner top first, then collapse the full view */
      glideToStrip(s, 850, () => {
        s.classList.remove('full-open');
        t.textContent = 'Full project';
        document.getElementById('floatClose').classList.remove('show');
      });
    }
  } else if (t.classList.contains('f-btn')) {
    setFilter(t.dataset.f, t);
  } else if (t.dataset.stage) {
    /* panel stage thumb swap */
    const pid = t.dataset.stage, i = +t.dataset.i;
    const im = D.projects.find(p => p.id === pid).summary.images[i];
    const hero = document.getElementById('stagehero-' + pid);
    hero.style.opacity = 0;
    setTimeout(() => {
      hero.src = src(im.src);
      hero.className = im.contain ? 'contain' : '';
      hero.style.objectPosition = im.pos || '';
      document.getElementById('stagecap-' + pid).textContent = im.cap || '';
      const tk = document.getElementById('stagetake-' + pid);
      if (tk) tk.textContent = im.take || '';
      document.querySelector(`.stage-hero[data-lb="${pid}"]`).dataset.gi = i;
      hero.style.opacity = 1;
    }, 180);
    t.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === t));
  } else if (t.dataset.lb !== undefined) {
    openLB(t.dataset.lb, +t.dataset.gi);
  }
});
/* keyboard: stage hero opens lightbox on Enter */
document.body.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('stage-hero')) {
    openLB(e.target.dataset.lb, +e.target.dataset.gi);
  }
});

/* chapter rail highlight */
const railIO = new IntersectionObserver(es => es.forEach(en => {
  if (!en.isIntersecting) return;
  const id = en.target.id;
  document.querySelectorAll(`.rail a[data-ch]`).forEach(a =>
    a.classList.toggle('cur', a.dataset.ch === id));
}), { rootMargin: '-15% 0px -70% 0px' });
document.querySelectorAll('.fchap').forEach(c => railIO.observe(c));

/* hash routing: deep links + back button */
function syncFromHash(push) {
  const id = location.hash.slice(1);
  if (id && document.getElementById('strip-' + id)) openProject(id, false, push);
  else if (id.startsWith('ch-')) { /* chapter anchor — leave open state untouched */ }
  else { clearFull(); strips().forEach(s => { s.classList.remove('open'); barExpanded(s, false); }); }
}
document.getElementById('floatClose').addEventListener('click', () => {
  const s = document.querySelector('.strip.full-open') || document.querySelector('.strip.open');
  if (!s) return;
  closeWithScroll(s);
});
window.addEventListener('popstate', () => syncFromHash(false));
if (location.hash) syncFromHash(false);

/* ═══════════════ LIGHTBOX (zoom / pan / gallery) ═══════════════ */
const lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg'),
      lbCap = document.getElementById('lbCap'), lbN = document.getElementById('lbN'),
      lbPrev = document.getElementById('lbPrev'), lbNext = document.getElementById('lbNext');
let lbGal = [], lbIdx = 0, z = 1, px = 0, py = 0, dragging = null;

function lbApply() { lbImg.parentElement.style.transform = `translate(${px}px,${py}px) scale(${z})`; }
function lbReset() { z = 1; px = py = 0; lbApply(); }
function lbShow(i) {
  lbIdx = i; lbReset();
  const it = lbGal[i];
  lbImg.src = src(it.src);
  lbCap.textContent = it.cap || '';
  lbN.textContent = (i + 1) + ' / ' + lbGal.length;
  lbPrev.classList.toggle('off', i === 0);
  lbNext.classList.toggle('off', i === lbGal.length - 1);
}
function openLB(pid, gi) {
  lbGal = GALLERIES[pid] || [];
  if (!lbGal.length) return;
  lbShow(Math.min(gi || 0, lbGal.length - 1));
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLB() { lb.classList.remove('open'); document.body.style.overflow = ''; }
document.getElementById('lbX').addEventListener('click', closeLB);
lb.addEventListener('click', e => { if (e.target === lb) closeLB(); });
lbPrev.addEventListener('click', () => lbIdx > 0 && lbShow(lbIdx - 1));
lbNext.addEventListener('click', () => lbIdx < lbGal.length - 1 && lbShow(lbIdx + 1));
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeLB();
  if (e.key === 'ArrowLeft' && lbIdx > 0) lbShow(lbIdx - 1);
  if (e.key === 'ArrowRight' && lbIdx < lbGal.length - 1) lbShow(lbIdx + 1);
});
/* wheel zoom around cursor */
lb.addEventListener('wheel', e => {
  if (!lb.classList.contains('open')) return;
  e.preventDefault();
  const nz = Math.min(5, Math.max(1, z * (e.deltaY < 0 ? 1.15 : 0.87)));
  const r = lbImg.getBoundingClientRect(), cx = e.clientX - r.left - r.width / 2, cy = e.clientY - r.top - r.height / 2;
  px -= cx * (nz / z - 1); py -= cy * (nz / z - 1);
  z = nz; if (z === 1) { px = py = 0; } lbApply();
}, { passive: false });
/* drag pan */
const lbFrame = document.getElementById('lbFrame');
lbFrame.addEventListener('pointerdown', e => { dragging = { x: e.clientX - px, y: e.clientY - py }; lbFrame.setPointerCapture(e.pointerId); });
lbFrame.addEventListener('pointermove', e => { if (dragging) { px = e.clientX - dragging.x; py = e.clientY - dragging.y; lbApply(); } });
lbFrame.addEventListener('pointerup', () => dragging = null);
/* double click toggles zoom */
lbFrame.addEventListener('dblclick', () => { z = z > 1 ? 1 : 2.2; if (z === 1) { px = py = 0; } lbApply(); });

/* ═══════════════ CHARTS (lazy Chart.js) ═══════════════ */
let chartsLoaded = false, chartsLoading = false;
function loadCharts() {
  if (chartsLoaded) { initCharts(); return; }
  if (chartsLoading) return;
  chartsLoading = true;
  /* prefer the vendored local copy (works from disk / offline); fall back to
     the CDN if it isn't present. */
  const CDN = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js';
  const done = () => { chartsLoaded = true; initCharts(); };
  const load = (url, onfail) => {
    const s = document.createElement('script');
    s.src = url;
    s.onload = done;
    s.onerror = onfail;
    document.head.appendChild(s);
  };
  load('vendor/chart.umd.min.js', () => load(CDN, () => { chartsLoading = false; }));
}
function initCharts() {
  const SP = D.chartSpecs;
  const TICK = { color: '#8a8478', font: { size: 10, family: "'JetBrains Mono', monospace" } };
  const GRID = { color: 'rgba(0,0,0,0.05)' };
  document.querySelectorAll('canvas[data-chart]').forEach(cv => {
    if (cv.dataset.done) return;
    const sp = SP[cv.dataset.chart];
    if (!sp) return;
    const horizontal = sp.axis === 'y';
    const valuePlugin = {
      id: 'vals',
      afterDatasetsDraw(chart) {
        const ctx = chart.ctx; ctx.save();
        ctx.font = '600 10px "JetBrains Mono", monospace'; ctx.fillStyle = '#211E19';
        chart.data.datasets.forEach((ds, di) => {
          chart.getDatasetMeta(di).data.forEach((bar, i) => {
            const v = ds.data[i]; if (v == null) return;
            const label = sp.fmt ? v.toFixed(sp.fmt) : String(v);
            if (horizontal) { ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(label, bar.x + 4, bar.y); }
            else { ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText(label, bar.x, bar.y - 3); }
          });
        });
        ctx.restore();
      }
    };
    new Chart(cv, {
      type: 'bar',
      data: {
        labels: sp.labels,
        datasets: [
          { label: 'Caravan', data: sp.caravan, backgroundColor: SP.colors.caravan, borderRadius: 3 },
          { label: 'Mid-rise', data: sp.midrise, backgroundColor: SP.colors.midrise, borderRadius: 3 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        indexAxis: horizontal ? 'y' : 'x',
        layout: { padding: horizontal ? { right: 30, top: 4 } : { top: 16, right: 10 } },
        datasets: { bar: { categoryPercentage: .78, barPercentage: .85 } },
        plugins: { legend: { display: false } },
        scales: horizontal ? {
          x: { ticks: TICK, grid: GRID, min: 0, max: sp.max, title: { display: true, text: sp.yTitle, color: '#8a8478', font: { size: 9 } } },
          y: { ticks: { ...TICK, font: { size: 9 } }, grid: { display: false } }
        } : {
          x: { ticks: { ...TICK, maxRotation: 38, font: { size: 9 } }, grid: { display: false } },
          y: { ticks: TICK, grid: GRID, min: 0, max: sp.max, title: { display: true, text: sp.yTitle, color: '#8a8478', font: { size: 9 } } }
        }
      },
      plugins: [valuePlugin]
    });
    cv.dataset.done = '1';
  });
}
