	<text transform="matrix(1 0 0 1 156.9795 55)" fill="#0A1E3A" font-family="'Arial-BoldMT'" font-size="13">URES</text>
	<text transform="matrix(1 0 0 1 93.7529 67)" fill="#0A1E3A" font-family="'ArialMT'" font-size="9">University Residence Environment Scale</text>
	<text transform="matrix(1 0 0 1 52 90)" fill="#3A2A0A" font-family="'Arial-BoldMT'" font-size="10">What it measures</text>
	<text transform="matrix(1 0 0 1 52 105)" fill="#4A6A9A" font-family="'ArialMT'" font-size="10">Social climate of student housing across</text>
	<text transform="matrix(1 0 0 1 52 119)" fill="#4A6A9A" font-family="'ArialMT'" font-size="10">10 validated subscales.</text>
	<text transform="matrix(1 0 0 1 52 133)" fill="#4A6A9A" font-family="'ArialMT'" font-size="8">*Translated to Hebrew for this study.</text>
	<line fill="none" stroke="#C0D0E8" x1="52" y1="145" x2="298" y2="145"/>
	<text transform="matrix(1 0 0 1 52 160)" fill="#3A2A0A" font-family="'Arial-BoldMT'" font-size="10">10 Subscales</text>
	<text transform="matrix(1 0 0 1 58 179)" fill="#0A1E3A" font-family="'ArialMT'" font-size="10">1  Involvement</text>
	<text transform="matrix(1 0 0 1 58 209)" fill="#0A1E3A" font-family="'ArialMT'" font-size="10">2  Emotional support</text>
	<text transform="matrix(1 0 0 1 58 239)" fill="#0A1E3A" font-family="'ArialMT'" font-size="10">3  Independence</text>
	<text transform="matrix(1 0 0 1 58 269)" fill="#0A1E3A" font-family="'ArialMT'" font-size="10">4  Traditional social</text>
	<text transform="matrix(1 0 0 1 58 299)" fill="#0A1E3A" font-family="'ArialMT'" font-size="10">5  Competition</text>
	<text transform="matrix(1 0 0 1 179 179)" fill="#0A1E3A" font-family="'ArialMT'" font-size="10">6  Academic achievement</text>
	<text transform="matrix(1 0 0 1 179 209)" fill="#0A1E3A" font-family="'ArialMT'" font-size="10">7  Intellectuality</text>
	<text transform="matrix(1 0 0 1 179 239)" fill="#0A1E3A" font-family="'ArialMT'" font-size="10">8  Order &amp; organisation</text>
	<text transform="matrix(1 0 0 1 179 269)" fill="#0A1E3A" font-family="'ArialMT'" font-size="10">9  Student influence</text>
	<text transform="matrix(1 0 0 1 179 299)" fill="#0A1E3A" font-family="'ArialMT'" font-size="10">10  Innovation</text>
	<line fill="none" stroke="#C0D0E8" x1="52" y1="318" x2="298" y2="318"/>
	<text transform="matrix(1 0 0 1 52 334)" fill="#3A2A0A" font-family="'Arial-BoldMT'" font-size="10">Format</text>
	<text transform="matrix(1 0 0 1 52 349)" fill="#4A6A9A" font-family="'ArialMT'" font-size="10">86-item true/false questionnaire</text>
	<text transform="matrix(1 0 0 1 52 363)" fill="#4A6A9A" font-family="'ArialMT'" font-size="10">Scores normalised 0–1 per subscale</text>
</g>
