<title>The loneliness epidemic — key statistics 2015–2018</title>
<desc>Three research findings illustrating the severity of the loneliness epidemic.</desc>
<text transform="matrix(1 0 0 1 40 44)" fill="#888888" font-family="'ArialMT'" font-size="12">The loneliness epidemic</text>
<line fill="none" stroke="#CCCCCC" stroke-width="0.5" x1="40" y1="58" x2="640" y2="58"/>
<rect x="40" y="72" opacity="0.9" fill="#E24B4A" enable-background="new    " width="4" height="72"/>
<text transform="matrix(1 0 0 1 58 94)" fill="#888888" font-family="'ArialMT'" font-size="12">Cigna / Ipsos survey, 2018 — n = 20,096 US adults</text>
<text transform="matrix(1 0 0 1 58 120)" opacity="0.75" fill="#2C2C2C" enable-background="new    " font-family="'ArialMT'" font-size="14">Most Americans are </text>
<text transform="matrix(1 0 0 1 185.5996 120)" fill="#E24B4A" font-family="'Arial-BoldMT'" font-size="14">considered lonely</text>
<text transform="matrix(1 0 0 1 304.6338 120)" opacity="0.75" fill="#2C2C2C" enable-background="new    " font-family="'ArialMT'" font-size="14"> — </text>
<text transform="matrix(1 0 0 1 326.4131 120)" fill="#E24B4A" font-family="'Arial-BoldMT'" font-size="14">54%</text>
<text transform="matrix(1 0 0 1 354.4336 120)" opacity="0.75" fill="#2C2C2C" enable-background="new    " font-family="'ArialMT'" font-size="14"> scored above the loneliness threshold</text>
<text transform="matrix(1 0 0 1 58 140)" opacity="0.75" fill="#2C2C2C" enable-background="new    " font-family="'ArialMT'" font-size="14">on the UCLA scale. </text>
<text transform="matrix(1 0 0 1 181.7373 140)" fill="#E24B4A" font-family="'Arial-BoldMT'" font-size="14">Only half</text>
<text transform="matrix(1 0 0 1 241.6338 140)" opacity="0.75" fill="#2C2C2C" enable-background="new    " font-family="'ArialMT'" font-size="14"> reported a meaningful in-person interaction </text>
<text transform="matrix(1 0 0 1 516.3496 140)" fill="#E24B4A" font-family="'Arial-BoldMT'" font-size="14">that day.</text>
<line opacity="0.5" fill="none" stroke="#CCCCCC" stroke-width="0.5" enable-background="new    " x1="40" y1="166" x2="640" y2="166"/>
<rect x="40" y="180" opacity="0.9" fill="#E24B4A" enable-background="new    " width="4" height="72"/>
<text transform="matrix(1 0 0 1 58 202)" fill="#888888" font-family="'ArialMT'" font-size="12">Holt-Lunstad et al., 2015 — meta-analysis, 70 studies, 3.4M participants</text>
<text transform="matrix(1 0 0 1 58 228)" opacity="0.75" fill="#2C2C2C" enable-background="new    " font-family="'ArialMT'" font-size="14">Loneliness raises the risk of </text>
<text transform="matrix(1 0 0 1 234.6406 228)" fill="#E24B4A" font-family="'Arial-BoldMT'" font-size="14">early death by 26%</text>
<text transform="matrix(1 0 0 1 360.7021 228)" opacity="0.75" fill="#2C2C2C" enable-background="new    " font-family="'ArialMT'" font-size="14"> — a mortality risk</text>
<text transform="matrix(1 0 0 1 58 248)" fill="#E24B4A" font-family="'Arial-BoldMT'" font-size="14">equivalent to smoking 15 cigarettes a day</text>
<text transform="matrix(1 0 0 1 334.9854 248)" opacity="0.75" fill="#2C2C2C" enable-background="new    " font-family="'ArialMT'" font-size="14"> and greater than obesity.</text>
<line opacity="0.5" fill="none" stroke="#CCCCCC" stroke-width="0.5" enable-background="new    " x1="40" y1="274" x2="640" y2="274"/>
<rect x="40" y="288" opacity="0.9" fill="#E24B4A" enable-background="new    " width="4" height="72"/>
<text transform="matrix(1 0 0 1 58 310)" fill="#888888" font-family="'ArialMT'" font-size="12">OECD school survey, 2003–2018</text>
<text transform="matrix(1 0 0 1 58 336)" opacity="0.75" fill="#2C2C2C" enable-background="new    " font-family="'ArialMT'" font-size="14">Among 15-year-olds, reported loneliness </text>
<text transform="matrix(1 0 0 1 314.0264 336)" fill="#E24B4A" font-family="'Arial-BoldMT'" font-size="14">nearly doubled</text>
<text transform="matrix(1 0 0 1 413.5986 336)" opacity="0.75" fill="#2C2C2C" enable-background="new    " font-family="'ArialMT'" font-size="14"> — from </text>
<text transform="matrix(1 0 0 1 467.2676 336)" fill="#E24B4A" font-family="'Arial-BoldMT'" font-size="14">8% to 15%</text>
<text transform="matrix(1 0 0 1 58 356)" opacity="0.75" fill="#2C2C2C" enable-background="new    " font-family="'ArialMT'" font-size="14">across OECD countries over 15 years.</text>
